[project]
name = "pibras-standard"
version = "0.1.0"
description = "Executable PIBRAS public standard checks"
readme = "README.md"
requires-python = "==3.13.9"
dependencies = [
    "jsonschema[format]==4.26.0",
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "openapi-spec-validator==0.9.0",
    "pip-audit==2.10.1",
    "pytest==8.4.2",
    "shellcheck-py==0.11.0.1",
]
