openapi: 3.1.0
info:
  title: PIBRAS Reference API
  version: 0.2-draft
  summary: API mínima de referência para implementações compatíveis com PIBRAS.
  description: >
    Este contrato define a superfície mínima esperada para uma implementação
    compatível: leitura de unidades, imóveis, listings, política de exposição
    e catálogo de casos de conformidade. É um contrato de referência; não
    implementa um servidor de autenticação, mas exige portador (bearer) em
    operações protegidas. x-implementation distingue as operações apenas especificadas
    (specification-only) das disponíveis no servidor local (local-server). O health check é público.
servers:
  - url: https://api.pibras.org/v0
    description: URL ilustrativa para implementações de referência.
tags:
  - name: Units
  - name: Properties
  - name: Listings
  - name: ExposurePolicy
  - name: Conformance
  - name: PrivacyOperations
security:
  - bearerAuth: []
paths:
  /units/{unit_id}:
    get:
      tags: [Units]
      x-implementation: specification-only
      operationId: getUnit
      summary: Recupera uma unidade física durável.
      parameters:
        - $ref: "#/components/parameters/UnitId"
      responses:
        "200":
          $ref: "#/components/responses/UnitResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /properties/{property_id}:
    get:
      tags: [Properties]
      x-implementation: specification-only
      operationId: getProperty
      summary: Recupera um ciclo comercial de imóvel.
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          $ref: "#/components/responses/PropertyResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /listings/{listing_id}:
    get:
      tags: [Listings]
      x-implementation: specification-only
      operationId: getListing
      summary: Recupera uma exposição por canal.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          $ref: "#/components/responses/ListingResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /properties/{property_id}/exposure-policy:
    get:
      tags: [ExposurePolicy]
      x-implementation: specification-only
      operationId: getPropertyExposurePolicy
      summary: Recupera a política de exposição vigente para um imóvel.
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          $ref: "#/components/responses/ExposurePolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /conformance/cases:
    get:
      tags: [Conformance]
      x-implementation: specification-only
      operationId: listConformanceCases
      summary: Lista os casos golden que uma implementação compatível deve executar.
      responses:
        "200":
          description: Casos de conformidade publicados pelo padrão.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConformanceTestCase"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /privacy/sharing-decisions:
    post:
      tags: [PrivacyOperations]
      x-implementation: specification-only
      operationId: decideSharing
      summary: Avalia previamente um compartilhamento e aplica default-deny.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharingDecisionRequest"
      responses:
        "200":
          description: Decisão reproduzível, vinculada à finalidade e à allowlist avaliadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharingDecisionResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /privacy/sharing-events:
    post:
      tags: [PrivacyOperations]
      x-implementation: specification-only
      operationId: appendSharingEvent
      summary: Registra no ledger um compartilhamento efetivamente realizado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharingEvent"
      responses:
        "201":
          description: Evento imutável registrado no ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharingEvent"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /privacy/dsar-propagations:
    post:
      tags: [PrivacyOperations]
      x-implementation: specification-only
      operationId: propagateDataSubjectRequest
      summary: Registra e acompanha a propagação de uma solicitação do titular.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DSARPropagation"
      responses:
        "201":
          description: Propagação vinculada ao parceiro e à solicitação de origem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DSARPropagation"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /health:
    get:
      operationId: healthCheck
      x-implementation: local-server
      servers:
      - url: /
      security: []
      responses:
        '200':
          description: Resultado do servidor local.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/ingest/raw:
    post:
      operationId: ingestRaw
      x-implementation: local-server
      servers:
      - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawInput'
      responses:
        '201':
          description: Resultado do servidor local.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawReceiptEnvelope'
        '401':
          $ref: '#/components/responses/Local401'
        '403':
          $ref: '#/components/responses/Local403'
  /api/v1/ingest/csv-row:
    post:
      operationId: mapCsvRow
      x-implementation: local-server
      servers:
      - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsvInput'
      responses:
        '201':
          description: Resultado do servidor local.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvBundleEnvelope'
        '401':
          $ref: '#/components/responses/Local401'
        '403':
          $ref: '#/components/responses/Local403'
  /api/v1/ingest/kenlo:
    post:
      operationId: mapKenlo
      x-implementation: local-server
      servers:
      - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KenloInput'
      responses:
        '201':
          description: Resultado do servidor local.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaBundleEnvelope'
        '401':
          $ref: '#/components/responses/Local401'
        '403':
          $ref: '#/components/responses/Local403'
  /api/v1/ingest/zap-xml:
    post:
      operationId: mapZapXml
      x-implementation: local-server
      servers:
      - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XmlInput'
      responses:
        '201':
          description: Resultado do servidor local.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaBundleEnvelope'
        '401':
          $ref: '#/components/responses/Local401'
        '403':
          $ref: '#/components/responses/Local403'
  /api/v1/dedupe/match:
    post:
      operationId: matchUnit
      x-implementation: local-server
      servers:
      - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchInput'
      responses:
        '200':
          description: Resultado do servidor local.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResultEnvelope'
        '401':
          $ref: '#/components/responses/Local401'
        '403':
          $ref: '#/components/responses/Local403'
  /api/v1/survivorship/arbitrate:
    post:
      operationId: arbitrate
      x-implementation: local-server
      servers:
      - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArbitrationInput'
      responses:
        '200':
          description: Resultado do servidor local.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArbitrationResultEnvelope'
        '401':
          $ref: '#/components/responses/Local401'
        '403':
          $ref: '#/components/responses/Local403'
  /api/v1/policy/project:
    post:
      operationId: projectPolicy
      x-implementation: local-server
      servers:
      - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectionInput'
      responses:
        '200':
          description: Resultado do servidor local.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionResultEnvelope'
        '401':
          $ref: '#/components/responses/Local401'
        '403':
          $ref: '#/components/responses/Local403'
  /api/v1/crm/twenty/from:
    post:
      operationId: importTwenty
      x-implementation: local-server
      servers:
      - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmInput'
      responses:
        '200':
          description: Resultado do servidor local.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmResultEnvelope'
        '401':
          $ref: '#/components/responses/Local401'
        '403':
          $ref: '#/components/responses/Local403'
  /api/v1/feeds/portal:
    post:
      operationId: generateFeed
      x-implementation: local-server
      servers:
      - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedInput'
      responses:
        '200':
          description: Resultado do servidor local.
          content:
            application/xml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Local401'
        '403':
          $ref: '#/components/responses/Local403'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Token portador exigido nas operações protegidas. Requisições sem
        credencial recebem 401; credenciais sem permissão de exposição
        recebem 403.
  parameters:
    UnitId:
      name: unit_id
      in: path
      required: true
      description: Identificador UUID da unidade; valores fora do formato retornam 400.
      schema:
        type: string
        format: uuid
    PropertyId:
      name: property_id
      in: path
      required: true
      description: Identificador UUID do imóvel; valores fora do formato retornam 400.
      schema:
        type: string
        format: uuid
    ListingId:
      name: listing_id
      in: path
      required: true
      description: Identificador UUID do listing; valores fora do formato retornam 400.
      schema:
        type: string
        format: uuid
  schemas:
    Health:
      type: object
      required:
      - status
      - version
      - timestamp
      properties:
        status:
          const: ok
        version:
          type: string
        timestamp:
          type: string
          format: date-time
    LocalError:
      type: object
      required:
      - success
      - error
      properties:
        success:
          const: false
        error:
          type: string
    RawInput:
      type: object
      required:
      - source_system
      - payload
      properties:
        source_system:
          $ref: ./schema/mbras.schema.json#/$defs/SourceSystem
        payload:
          oneOf:
          - type: object
          - type: array
            items:
              type: object
    RawReceipt:
      type: object
      required:
      - ingestion_id
      - source_system
      - payload_sha256
      - record_count
      - trust_tier
      - ingested_at
      - provenance
      - payload
      properties:
        ingestion_id:
          type: string
          format: uuid
        source_system:
          $ref: ./schema/mbras.schema.json#/$defs/SourceSystem
        payload_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        record_count:
          type: integer
        trust_tier:
          type: integer
        ingested_at:
          type: string
          format: date-time
        provenance:
          $ref: ./schema/mbras.schema.json#/$defs/Provenance
        payload:
          oneOf:
          - type: object
          - type: array
            items:
              type: object
    CsvInput:
      type: object
      required:
      - row
      properties:
        row:
          type: object
        batch_id:
          type: string
    KenloInput:
      type: object
      description: Registro aberto do webhook Kenlo.
      properties:
        codigo:
          type:
          - string
          - number
          - 'null'
        endereco:
          anyOf:
          - type: object
          - type: 'null'
    XmlInput:
      type: object
      required:
      - xml_item
      properties:
        xml_item:
          type: string
        batch_id:
          type: string
    CsvBundle:
      type: object
      required:
      - unit
      - property
      - raw_receipt
      properties:
        unit:
          $ref: '#/components/schemas/Unit'
        property:
          $ref: '#/components/schemas/Property'
        raw_receipt:
          $ref: '#/components/schemas/RawReceipt'
    MediaBundle:
      allOf:
      - $ref: '#/components/schemas/CsvBundle'
      - type: object
        required:
        - media_assets
        properties:
          media_assets:
            type: array
            items:
              $ref: ./schema/mbras.schema.json#/$defs/MediaAsset
    MatchInput:
      type: object
      required:
      - incoming_unit
      - existing_inventory
      properties:
        incoming_unit:
          $ref: '#/components/schemas/Unit'
        existing_inventory:
          type: array
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: string
    MatchResult:
      type: object
      required:
      - candidate_unit_id
      - confidence
      - review_state
      - match_reasons
      properties:
        candidate_unit_id:
          anyOf:
          - type: string
          - type: 'null'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        review_state:
          $ref: ./schema/mbras.schema.json#/$defs/DedupeReviewState
        match_reasons:
          type: array
          items:
            type: string
    ArbitrationInput:
      type: object
      required:
      - entity_type
      - entity_id
      - current_data
      - current_trust_tier
      - incoming_data
      - incoming_source
      - incoming_trust_tier
      properties:
        entity_type:
          type: string
          enum:
          - property
          - unit
          - building
          - party
        entity_id:
          anyOf:
          - type: string
          - type: 'null'
        current_data:
          anyOf:
          - type: object
          - type: 'null'
        current_trust_tier:
          anyOf:
          - type: integer
          - type: 'null'
        incoming_data:
          type: object
        incoming_source:
          $ref: ./schema/mbras.schema.json#/$defs/SourceSystem
        incoming_trust_tier:
          type: integer
    ArbitrationResult:
      type: object
      required:
      - action
      - applied_data
      - pending_change
      - reasons
      properties:
        action:
          type: string
          enum:
          - direct_apply
          - create_pending_change
          - mixed
          - noop
        applied_data:
          type: object
        pending_change:
          anyOf:
          - type: object
          - type: 'null'
        reasons:
          type: array
          items:
            type: string
    ProjectionInput:
      type: object
      required:
      - property
      - policy
      - channel_type
      - caller_role
      properties:
        property:
          $ref: '#/components/schemas/Property'
        unit:
          $ref: '#/components/schemas/Unit'
        media_assets:
          type: array
          items:
            $ref: ./schema/mbras.schema.json#/$defs/MediaAsset
        policy:
          $ref: '#/components/schemas/ExposurePolicy'
        channel_type:
          type: string
          enum:
          - website
          - portal
          - crm
          - broker_network
          - paid_ad
        caller_role:
          type: string
    ProjectionResult:
      anyOf:
      - type: object
        required:
        - property
        - unit
        - media_assets
        - evaluation
        properties:
          property:
            type: object
          unit:
            anyOf:
            - type: object
            - type: 'null'
          media_assets:
            type: array
            items:
              type: object
          evaluation:
            type: object
            required:
            - decision
            - reasons
            properties:
              decision:
                type: string
                enum:
                - allow
                - mask
                - deny
                - needs_approval
              reasons:
                type: array
                items:
                  type: string
      - type: 'null'
    CrmInput:
      type: object
      required:
      - payload
      - currentProperty
      - currentUnit
      properties:
        payload:
          type: object
        currentProperty:
          anyOf:
          - $ref: '#/components/schemas/Property'
          - type: 'null'
        currentUnit:
          anyOf:
          - $ref: '#/components/schemas/Unit'
          - type: 'null'
    CrmResult:
      type: object
      required:
      - propertyArbitration
      - raw_receipt
      properties:
        propertyArbitration:
          $ref: '#/components/schemas/ArbitrationResult'
        unitArbitration:
          $ref: '#/components/schemas/ArbitrationResult'
        raw_receipt:
          $ref: '#/components/schemas/RawReceipt'
    FeedInput:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - property
            - policy
            properties:
              property:
                $ref: '#/components/schemas/Property'
              unit:
                $ref: '#/components/schemas/Unit'
              policy:
                $ref: '#/components/schemas/ExposurePolicy'
              media_assets:
                type: array
                items:
                  $ref: ./schema/mbras.schema.json#/$defs/MediaAsset
        format:
          type: string
          enum:
          - zap
          - pibras
    RawReceiptEnvelope:
      type: object
      required:
      - success
      - data
      properties:
        success:
          const: true
        data:
          $ref: '#/components/schemas/RawReceipt'
    CsvBundleEnvelope:
      type: object
      required:
      - success
      - data
      properties:
        success:
          const: true
        data:
          $ref: '#/components/schemas/CsvBundle'
    MediaBundleEnvelope:
      type: object
      required:
      - success
      - data
      properties:
        success:
          const: true
        data:
          $ref: '#/components/schemas/MediaBundle'
    MatchResultEnvelope:
      type: object
      required:
      - success
      - data
      properties:
        success:
          const: true
        data:
          $ref: '#/components/schemas/MatchResult'
    ArbitrationResultEnvelope:
      type: object
      required:
      - success
      - data
      properties:
        success:
          const: true
        data:
          $ref: '#/components/schemas/ArbitrationResult'
    ProjectionResultEnvelope:
      type: object
      required:
      - success
      - data
      properties:
        success:
          const: true
        data:
          $ref: '#/components/schemas/ProjectionResult'
    CrmResultEnvelope:
      type: object
      required:
      - success
      - data
      properties:
        success:
          const: true
        data:
          $ref: '#/components/schemas/CrmResult'
    Unit:
      $ref: "./schema/mbras.schema.json#/$defs/Unit"
    Property:
      $ref: "./schema/mbras.schema.json#/$defs/Property"
    Listing:
      $ref: "./schema/mbras.schema.json#/$defs/Listing"
    ExposurePolicy:
      $ref: "./schema/mbras.schema.json#/$defs/ExposurePolicy"
    ConformanceTestCase:
      $ref: "./schema/mbras.schema.json#/$defs/ConformanceTestCase"
    ProcessingPurpose:
      $ref: "./schema/mbras.schema.json#/$defs/ProcessingPurpose"
    LegalBasisAssessment:
      $ref: "./schema/mbras.schema.json#/$defs/LegalBasisAssessment"
    PartnerRelationship:
      $ref: "./schema/mbras.schema.json#/$defs/PartnerRelationship"
    FieldAllowlist:
      $ref: "./schema/mbras.schema.json#/$defs/FieldAllowlist"
    SharingEvent:
      $ref: "./schema/mbras.schema.json#/$defs/SharingEvent"
    DSARPropagation:
      $ref: "./schema/mbras.schema.json#/$defs/DSARPropagation"
    SharingDecisionRequest:
      type: object
      additionalProperties: false
      required: [purpose, legal_basis_assessment, partner_relationship, field_allowlist]
      properties:
        purpose:
          $ref: "#/components/schemas/ProcessingPurpose"
        legal_basis_assessment:
          $ref: "#/components/schemas/LegalBasisAssessment"
        partner_relationship:
          $ref: "#/components/schemas/PartnerRelationship"
        field_allowlist:
          $ref: "#/components/schemas/FieldAllowlist"
    SharingDecisionResponse:
      type: object
      additionalProperties: false
      required: [decision, evaluated_at, reason_codes]
      properties:
        decision:
          type: string
          enum: [allow, deny]
        evaluated_at:
          type: string
          format: date-time
        reason_codes:
          type: array
          items:
            type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
  examples:
    MissingAuthError:
      summary: Requisição sem credencial portadora.
      value:
        code: unauthorized
        message: Credencial portadora ausente ou inválida.
    PolicyDeniedError:
      summary: Exposição negada pela política vigente.
      value:
        code: policy_denied
        message: A política de exposição vigente nega acesso a este recurso.
    InvalidPathParameterError:
      summary: Parâmetro de caminho fora do formato UUID.
      value:
        code: invalid_path_parameter
        message: O identificador informado não é um UUID válido.
  responses:
    UnitResponse:
      description: Unidade física durável.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Unit"
    PropertyResponse:
      description: Ciclo comercial de imóvel.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Property"
    ListingResponse:
      description: Exposição por canal.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Listing"
    ExposurePolicyResponse:
      description: Política de exposição do recurso.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExposurePolicy"
    BadRequestResponse:
      description: Parâmetro de caminho inválido (formato UUID exigido).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidPathParameter:
              $ref: "#/components/examples/InvalidPathParameterError"
    UnauthorizedResponse:
      description: Credencial portadora ausente ou inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingAuth:
              $ref: "#/components/examples/MissingAuthError"
    ForbiddenResponse:
      description: Acesso negado pela política de exposição.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            policyDenied:
              $ref: "#/components/examples/PolicyDeniedError"
    ErrorResponse:
      description: Erro padronizado da API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Local401:
      description: Credencial portadora ausente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LocalError'
    Local403:
      description: Credencial não autorizada ou servidor sem token configurado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LocalError'
